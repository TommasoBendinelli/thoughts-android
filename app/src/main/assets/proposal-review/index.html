<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=3">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'none'; form-action 'none'; base-uri 'none'">
<link rel="stylesheet" href="style.css">
<title>Edit source</title>
</head>
<body>
<header>
  <div class="heading">
    <button id="back" aria-label="Back to PDF">‹</button>
    <div class="headingText"><strong>Edit source</strong><small id="filename"></small></div>
    <button id="save" class="primary">Save</button>
  </div>
  <nav aria-label="Editor actions">
    <button id="undo" aria-label="Undo">↶</button><button id="redo" aria-label="Redo">↷</button>
    <small id="status" role="status">Opening source…</small>
    <button id="previous" aria-label="Previous proposal" hidden>‹</button><button id="next" aria-label="Next proposal" hidden>›</button>
    <button id="history" aria-label="History" title="History"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11a9 9 0 1 1 2.6 7M3 4v7h7M12 7v5l3 2"/></svg></button>
    <button id="visibility" aria-label="Hide agent proposals" title="Hide agent proposals" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eyeSlash" d="m3 3 18 18"/></svg></button>
  </nav>
<div id="navigationMessage" role="status" aria-live="polite" hidden></div>
<div id="hiddenProposals" role="status" hidden><span id="hiddenProposalsText"></span><button id="showHiddenProposals">Show</button></div>
<div id="markerBar" hidden><span>Card markers</span><button id="copyStartMarker">Copy start</button><button id="copyEndMarker">Copy end</button></div>
<div id="message" role="alert" aria-live="assertive"></div>
</header>
<div id="mergeMessage" role="alert" hidden>Some edits overlap. Edit the conflict blocks below, keeping the text you want and removing all marker lines before saving. Your draft and the previous source are preserved in History.</div>
<main id="editor"></main>
<section id="historyPanel" hidden></section>
<div id="initialSelectionActions" class="selectionPopup" hidden><button id="cut">Cut</button><button id="copy">Copy</button><button id="paste">Paste</button></div>
<script src="diagnostics.js"></script>
<script src="modules.js"></script>
<script src="history.js"></script>
<script src="engine.js"></script>
<script src="sourceModel.js"></script>
<script src="sourceNavigation.js"></script>
<script src="ui.js"></script>
</body>
</html>
