plugins {
    id 'com.android.application'
    id 'com.google.devtools.ksp' version '2.3.9'
}

// Play release inputs come from Gradle properties (-Pname=value) or environment variables, never
// from the repository. Debug and sandbox builds ignore all of them.
def thoughtsReleaseInput = { String property, String environment ->
    def value = project.findProperty(property) ?: System.getenv(environment)
    value == null || value.toString().trim().isEmpty() ? null : value.toString().trim()
}
def uploadStoreFile = thoughtsReleaseInput('thoughtsUploadStoreFile', 'THOUGHTS_UPLOAD_STORE_FILE')
def uploadStorePassword = thoughtsReleaseInput('thoughtsUploadStorePassword', 'THOUGHTS_UPLOAD_STORE_PASSWORD')
def uploadStorePasswordFile = thoughtsReleaseInput('thoughtsUploadStorePasswordFile', 'THOUGHTS_UPLOAD_STORE_PASSWORD_FILE')
if (uploadStorePassword == null && uploadStorePasswordFile != null) {
    uploadStorePassword = file(uploadStorePasswordFile).getText('UTF-8').trim()
}
def uploadKeyAlias = thoughtsReleaseInput('thoughtsUploadKeyAlias', 'THOUGHTS_UPLOAD_KEY_ALIAS') ?: 'upload'
def uploadKeyPassword = thoughtsReleaseInput('thoughtsUploadKeyPassword', 'THOUGHTS_UPLOAD_KEY_PASSWORD') ?: uploadStorePassword
if (uploadStoreFile != null && uploadStorePassword == null) {
    throw new GradleException('thoughtsUploadStoreFile is set but no store password: pass thoughtsUploadStorePassword(File) or THOUGHTS_UPLOAD_STORE_PASSWORD(_FILE).')
}
// Play versionCode scheme: YYMMDDNN (date of the upload + two-digit build index), e.g. 26102101.
// It must grow with every upload; pass it for release builds only. Without it the phone's debug
// numbering (57, versionName 3.0.0) stays as before.
def playVersionCode = thoughtsReleaseInput('thoughtsVersionCode', 'THOUGHTS_VERSION_CODE')
def playVersionName = thoughtsReleaseInput('thoughtsVersionName', 'THOUGHTS_VERSION_NAME')
if (playVersionCode != null && !(playVersionCode ==~ /[1-9][0-9]{0,8}/)) {
    throw new GradleException("thoughtsVersionCode must be a positive integer below 1e9 (YYMMDDNN), got ${playVersionCode}")
}
if (playVersionCode == null && gradle.startParameter.taskNames.any { it.toLowerCase(Locale.ROOT).contains('bundlerelease') }) {
    throw new GradleException('bundleRelease is for Play uploads: pass -PthoughtsVersionCode=YYMMDDNN (higher than the last upload).')
}

Properties localProperties = new Properties()
def localPropertiesFile = project.rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

// Values that name one deployment (its server, its people, its machines) come from -P<name>=<value>
// or the ignored local.properties, -P first. The defaults are neutral: a build without them names
// no real server or person, and the features that need them stay off.
def thoughtsBuildInput = { String name, String fallback ->
    def value = (project.findProperty(name) ?: localProperties.getProperty(name) ?: '').toString().trim()
    value.isEmpty() ? fallback : value
}
def buildConfigString = { String value ->
    '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}
def httpsHostOf = { String name, String url ->
    def uri = null
    try {
        uri = new URI(url)
    } catch (URISyntaxException ignored) {
    }
    if (uri == null || uri.scheme != 'https' || !uri.host || uri.rawUserInfo != null || uri.rawQuery != null || uri.rawFragment != null) {
        throw new GradleException("${name} must be an https:// address with a host, got ${url}")
    }
    uri.host.toLowerCase(Locale.ROOT)
}
// The public Thoughts server this build names in citation links and app links. A phone always
// talks to the server saved in Settings; this one is contacted only to migrate a legacy address.
def publicServerUrl = thoughtsBuildInput('thoughtsPublicServerUrl', 'https://thoughts.example.org').replaceAll('/+$', '')
def publicServerHost = httpsHostOf('thoughtsPublicServerUrl', publicServerUrl)
// Former hosts of that server (comma-separated): their links keep opening in Thoughts, and a phone
// saved with https://<host> moves to the public URL once. Empty: no migration, no extra link host.
def legacyServerHosts = thoughtsBuildInput('thoughtsLegacyServerHosts', '')
        .split(/[,\s]+/).collect { it.trim().toLowerCase(Locale.ROOT).replaceAll('\\.$', '') }.findAll { it }
legacyServerHosts.each {
    if (!(it ==~ /[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)*/)) {
        throw new GradleException("thoughtsLegacyServerHosts must list host names (comma-separated), got ${it}")
    }
}
// The card-pilot site that serves Review > Mental Model (its page `mental-model`); the name is that of the
// A/B testing tab it once served too. Empty: Review has no Mental Model button.
def abTestingUrl = thoughtsBuildInput('thoughtsAbTestingUrl', '')
if (abTestingUrl) {
    httpsHostOf('thoughtsAbTestingUrl', abTestingUrl)
    if (!abTestingUrl.endsWith('/')) abTestingUrl += '/'
}
// The isolated test service Thoughts Test (sandbox) may talk to: https://HOST[:PORT], or
// http://10.0.2.2:PORT for a hermetic server on the emulator's host (tools/run-isolated-tests.py
// --server-config); nothing else is accepted.
def testServerUrl = thoughtsBuildInput('thoughtsTestServerUrl', 'https://thoughts-test.example.org')
def hermeticTestServer = testServerUrl ==~ /http:\/\/10\.0\.2\.2:[0-9]{2,5}/
if (!hermeticTestServer) {
    if (!(testServerUrl ==~ /https:\/\/[^\s\/?#@]+/)) {
        throw new GradleException("thoughtsTestServerUrl must be https://HOST[:PORT] or http://10.0.2.2:PORT")
    }
    httpsHostOf('thoughtsTestServerUrl', testServerUrl)
}
// The author name a phone saved with this build's own server (public or legacy host) writes while
// none is set in Settings. Empty: every phone writes "Thoughts user" until a name is saved.
def ownerCommentAuthor = thoughtsBuildInput('thoughtsOwnerCommentAuthor', '')
// The author the old MJ PDF reader build wrote into its notes: a plain-UUID yellow Text note by this
// author is attributed to that reader (the server's THOUGHTS_LEGACY_MJ_PDF_AUTHOR). Empty: rule off.
def legacyMjPdfAuthor = thoughtsBuildInput('thoughtsLegacyMjPdfAuthor', '')
// Where study-mode captures (photos/ and videos/) arrive on the computer the agent runs on: the
// default of the {mentra_folder} setting.
def studyCaptureFolder = thoughtsBuildInput('thoughtsStudyCaptureFolder', '~/glasses')

// Push for agent notes (Firebase Cloud Messaging) reads a google-services.json that is never in the
// repository: -PthoughtsFirebaseConfig=<path>, by default ~/.config/thoughts/firebase/google-services.json.
// Each variant takes the client of its own application ID (firebase-config.groovy); without the file
// or that client its FIREBASE_* fields are empty and push is off. Only "on"/"off" is ever printed.
def thoughtsFirebaseConfigFile = {
    def home = System.getProperty('user.home')
    def configured = project.findProperty('thoughtsFirebaseConfig')?.toString()?.trim()
    def path = configured ?: "${home}/.config/thoughts/firebase/google-services.json"
    if (path == '~' || path.startsWith('~/')) path = home + path.substring(1)
    file(path)
}()
def selectFirebaseClient = new GroovyShell(getClass().classLoader).evaluate(file('firebase-config.groovy'))
def thoughtsPushStates = new TreeMap<String, String>()
// Push is a build option: -PthoughtsPush=on|off, by default on when that google-services.json exists.
// Only a build with push compiles in Firebase Cloud Messaging and Google Play services (dependencies
// below, src/push and its manifest); a build without push has src/nopush, contains no Google library,
// and agent notes reach the phone as before push (inbox checks and Study mode's listener).
def thoughtsPushBuild = {
    def value = project.findProperty('thoughtsPush')?.toString()?.trim()?.toLowerCase(Locale.ROOT)
    if (!value) return thoughtsFirebaseConfigFile.isFile()
    if (value in ['on', 'off']) return value == 'on'
    throw new GradleException("thoughtsPush must be on or off, got ${value}")
}()

android {
    defaultConfig {
        applicationId "org.tbend.thoughts"
        minSdkVersion 23
        compileSdkVersion 36
        targetSdkVersion 36
        versionCode playVersionCode != null ? playVersionCode.toInteger() : 57
        versionName playVersionName ?: (playVersionCode != null ? "3.0.0-play.${playVersionCode}" : "3.0.0")
        testInstrumentationRunner "com.gitlab.mudlej.MjPdfReader.testing.IsolatedTestRunner"
        buildConfigField "boolean", "IS_TEST_ENVIRONMENT", "false"
        buildConfigField "String", "TEST_SERVER_URL",
                buildConfigString(hermeticTestServer ? 'https://thoughts-test.example.org' : testServerUrl)
        buildConfigField "String", "THOUGHTS_PUBLIC_SERVER_URL", buildConfigString(publicServerUrl)
        buildConfigField "String", "THOUGHTS_LEGACY_SERVER_HOSTS", buildConfigString(legacyServerHosts.join(','))
        buildConfigField "String", "AB_TESTING_URL", buildConfigString(abTestingUrl)
        buildConfigField "String", "OWNER_COMMENT_AUTHOR", buildConfigString(ownerCommentAuthor)
        buildConfigField "String", "LEGACY_MJ_PDF_AUTHOR", buildConfigString(legacyMjPdfAuthor)
        buildConfigField "String", "STUDY_CAPTURE_FOLDER", buildConfigString(studyCaptureFolder)
        // App links (autoVerify) for the public host and the first legacy host; without a legacy
        // host the second filter repeats the public one.
        manifestPlaceholders.thoughtsPublicHost = publicServerHost
        manifestPlaceholders.thoughtsLegacyLinkHost = legacyServerHosts ? legacyServerHosts.first() : publicServerHost
        multiDexEnabled = true
        vectorDrawables.useSupportLibrary = true

        resValue "string", "CRASH_REPORT_APP_ID", "\"${localProperties.getProperty("AI")}\""
        resValue "string", "CRASH_REPORT_API_KEY", "\"${localProperties.getProperty("AK")}\""
        resValue "string", "CRASH_REPORT_API_URI", "\"${localProperties.getProperty("AU")}\""

        // The agent recall prediction service (review in two steps), from -PthoughtsRecallPredictorUrl /
        // -PthoughtsRecallPredictorToken or ignored local.properties; without both the feature is off.
        buildConfigField "String", "RECALL_PREDICTOR_URL", buildConfigString(thoughtsBuildInput('thoughtsRecallPredictorUrl', ''))
        buildConfigField "String", "RECALL_PREDICTOR_TOKEN", buildConfigString(thoughtsBuildInput('thoughtsRecallPredictorToken', ''))
    }

    buildFeatures {
        buildConfig = true
        resValues = true
        viewBinding = true
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    splits {
        abi {
            // Per-ABI APKs for sideloaded release builds only: an App Bundle (bundleRelease) cannot be
            // built together with ABI splits, and Play splits the bundle per device itself.
            def requestedTasks = gradle.startParameter.taskNames.collect { it.toLowerCase(Locale.ROOT) }
            enable requestedTasks.any { it.contains('release') } && !requestedTasks.any { it.contains('bundle') }
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
            universalApk true
        }
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    testBuildType "sandbox"

    signingConfigs {
        if (uploadStoreFile != null) {
            upload {
                storeFile file(uploadStoreFile)
                storeType 'pkcs12'
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
    }

    buildTypes {
        release {
            // Upload key for Google Play (Play App Signing re-signs for devices). Without the
            // upload inputs the release outputs are unsigned; debug keeps the debug keystore.
            if (uploadStoreFile != null) {
                signingConfig signingConfigs.upload
            }
            debuggable false
            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
            // The daily phone build: a debuggable APK runs interpreted and is never AOT-compiled, which
            // made Home several times slower. Pass -PthoughtsDebuggable=true when run-as access is needed.
            debuggable project.findProperty('thoughtsDebuggable') == 'true'
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildTypes.create("sandbox") {
        initWith buildTypes.debug
        debuggable true
        applicationIdSuffix ".sandbox"
        matchingFallbacks = ['debug']
        buildConfigField "boolean", "IS_TEST_ENVIRONMENT", "true"
        // -PthoughtsTestServerUrl=http://10.0.2.2:PORT points Thoughts Test at a hermetic server on the
        // emulator's host (tools/run-isolated-tests.py --server-config); only the sandbox gets it.
        if (hermeticTestServer) {
            buildConfigField "String", "TEST_SERVER_URL", buildConfigString(testServerUrl)
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled = true // for LocalDateTime before api < 26

        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace = 'com.gitlab.mudlej.MjPdfReader'
    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }
    sourceSets {
        androidTest.assets.srcDir "$projectDir/schemas"
    }
}

def abiVersionOffsets = ['armeabi-v7a': 1, 'arm64-v8a': 2, 'x86': 3, 'x86_64': 4]

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            def abi = output.filters.find {
                it.filterType == com.android.build.api.variant.FilterConfiguration.FilterType.ABI
            }?.identifier
            def offset = abiVersionOffsets[abi]
            // The legacy offset (offset*1000 + 57) would overtake later YYMMDDNN codes; Play builds
            // give every ABI APK the bundle's code (Play itself only receives the AAB).
            if (offset != null && playVersionCode == null) {
                output.versionCode.set(offset * 1000 + android.defaultConfig.versionCode)
            }
        }
        // The push option (thoughtsPush above): one of the two PushProvider versions, and the push manifest.
        variant.sources.kotlin.addStaticSourceDirectory(thoughtsPushBuild ? 'src/push/java' : 'src/nopush/java')
        if (thoughtsPushBuild) variant.sources.manifests.addStaticManifestFile('src/push/AndroidManifest.xml')
        def firebase = thoughtsPushBuild
            ? selectFirebaseClient(thoughtsFirebaseConfigFile, variant.applicationId.get())
            : [on: false, reason: project.hasProperty('thoughtsPush') ? 'not in this build, thoughtsPush=off' : 'not in this build, no google-services.json']
        [FIREBASE_APP_ID: 'appId', FIREBASE_API_KEY: 'apiKey', FIREBASE_PROJECT_ID: 'projectId', FIREBASE_SENDER_ID: 'senderId'].each { field, key ->
            variant.buildConfigFields.put(field, new com.android.build.api.variant.BuildConfigField(
                'String', '"' + (firebase.on ? firebase[key] : '') + '"', 'Push (firebase-config.groovy); empty: push is off'))
        }
        thoughtsPushStates[variant.name] = firebase.on ? 'on' : "off (${firebase.reason})"
    }
}
gradle.projectsEvaluated {
    logger.lifecycle('[thoughts-push] ' + thoughtsPushStates.collect { name, state -> "${name}: push ${state}" }.join(', '))
}

ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}

dependencies {
    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.4.0"
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'androidx.work:work-runtime-ktx:2.10.1'

    // Activity
    api 'androidx.activity:activity-ktx:1.13.0'

    // AndroidX Fragment library Kotlin
    implementation "androidx.fragment:fragment-ktx:1.8.9"
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.8'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.8'

    // Room
    implementation "androidx.room:room-runtime:2.8.4"
    implementation "androidx.room:room-ktx:2.8.4"
    implementation platform('org.jetbrains.kotlinx:kotlinx-serialization-bom:1.8.1')
    ksp "androidx.room:room-compiler:2.8.4"

    implementation project(':ThoughtsClient')
    // Android needs the AAR's JNI libraries; the JAR is only for host JVM tests.
    implementation 'com.github.luben:zstd-jni:1.5.7-7@aar'
    testImplementation 'com.github.luben:zstd-jni:1.5.7-7'

    implementation project(path: ':PdfiumAndroid')
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'


    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'

    // Material Design
    implementation 'com.google.android.material:material:1.14.0'

    // MJ PDF's fork of
    implementation project(':AndroidPdfViewer:android-pdf-viewer')

    // Gson
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'org.jsoup:jsoup:1.18.3'

    // kotlin coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    // Push for agent notes, only in a build with push (thoughtsPush above): Firebase Cloud Messaging
    // only (no analytics), initialized by the app itself and only when the build has a Firebase config.
    // BoM 34.19.0 is the last one whose libraries still run on minSdk 23 (35.x needs 24).
    if (thoughtsPushBuild) {
        implementation platform('com.google.firebase:firebase-bom:34.19.0')
        implementation 'com.google.firebase:firebase-messaging'
        // GoogleApiAvailability: no Google Play services, no push (the version firebase-messaging brings).
        implementation 'com.google.android.gms:play-services-base:18.9.0'
    }

    testImplementation 'junit:junit:4.13.2'
    // firebase-config.groovy is evaluated by FirebaseConfigSelectionTest with Gradle's own Groovy.
    testImplementation localGroovy()
    // Real SQLite for host JVM tests of raw SQL (default-folder migration).
    testImplementation 'org.xerial:sqlite-jdbc:3.53.4.0'
    androidTestImplementation 'androidx.test:core-ktx:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit-ktx:1.3.0'
    androidTestImplementation 'androidx.room:room-testing:2.8.4'

    //  required fir desugar for LocalDateTime with old APIs
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")


    // Area Crash Reporter
    implementation('ch.acra:acra-dialog:5.13.1') {
        exclude group: 'com.google.auto.service', module: 'auto-service'
    }
    implementation('ch.acra:acra-http:5.13.1') {
        exclude group: 'com.google.auto.service', module: 'auto-service'
    }
}

// Host JVM tests can pass even when Android's decoder is absent from the APK.
def verifyDebugZstdRuntime = tasks.register('verifyDebugZstdRuntime') {
    dependsOn 'packageDebug'
    def apk = layout.buildDirectory.file('outputs/apk/debug/app-debug.apk')
    inputs.file(apk)
    doLast {
        new java.util.zip.ZipFile(apk.get().asFile).withCloseable { archive ->
            def names = archive.entries().collect { it.name }
            ['arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'].each { abi ->
                if (!names.any { it.startsWith("lib/${abi}/libzstd-jni-") && it.endsWith('.so') }) {
                    throw new GradleException("Missing Android Zstd native library for ${abi}")
                }
            }
        }
    }
}
tasks.matching { it.name == 'assembleDebug' }.configureEach {
    dependsOn verifyDebugZstdRuntime
}
